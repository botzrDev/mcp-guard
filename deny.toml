# Configuration for cargo-deny
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Security vulnerability advisory database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Deny any crates with known vulnerabilities
ignore = [
    # rsa Marvin timing sidechannel: no fixed release exists; rsa only enters
    # Cargo.lock via sqlx-mysql, which this workspace never enables (postgres-only)
    "RUSTSEC-2023-0071",
    # http-types ASCII-invariant notice: pulled in via async-stripe, no fixed
    # http-types release available
    "RUSTSEC-2026-0174",
]

[licenses]
# License policy - Allow common permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # Workspace's own license (root/core/cli use the AGPL-3.0 SPDX id)
    "AGPL-3.0",
    # aws-lc-sys ships an OpenSSL-licensed component (permissive, pre-Apache-2.0 OpenSSL license)
    "OpenSSL",
    # webpki-roots (Mozilla CA bundle metadata) is CDLA-Permissive-2.0
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # ring uses ISC which is fine
    { name = "ring", allow = ["ISC"] },
    # Workspace's own commercial crates - not external dependencies
    { name = "mcp-guard-pro", allow = ["LicenseRef-Commercial"] },
    { name = "mcp-guard-enterprise", allow = ["LicenseRef-Commercial"] },
]

[bans]
# Dependency banning rules
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
# Where to get crates from
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
